<section class="bg-slate-950 px-6 py-20">

  <div class="mx-auto max-w-7xl">

    <div class="mb-12">
      <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-indigo-400">
        My Work
      </p>

      <h2 class="text-3xl font-bold text-white md:text-4xl">
        Featured Projects
      </h2>
    </div>

    <div class="grid gap-10 md:grid-cols-2">

      @for (project of projects; track project.name) {
        <article class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900">

          <app-screenshot-carousel
            [images]="project.images"
            [projectName]="project.name"
          />

          <div class="p-6">

            <!-- <h3 class="mb-3 text-xl font-bold text-white">
              {{ project.name }}
            </h3> -->

            <p class="mb-5 text-sm leading-6 text-slate-400">
              {{ project.description }}
            </p>

            <div class="flex flex-wrap gap-2">
              @for (technology of project.technologies; track technology) {
                <span class="rounded-full bg-indigo-500/10 px-3 py-1 text-xs text-indigo-300">
                  {{ technology }}
                </span>
              }
            </div>

          </div>

        </article>
      }

    </div>

  </div>

</section>
