<div class="relative w-full overflow-hidden rounded-2xl bg-slate-900">

  <!-- Screenshot -->
  @if (images.length > 0) {
    <div class="relative aspect-video w-full overflow-hidden">

      <img
        [src]="images[currentIndex()]"
        [alt]="projectName + ' screenshot ' + (currentIndex() + 1)"
        class="h-full w-full object-cover transition-all duration-500"
      />

      <!-- Previous -->
      @if (images.length > 1) {
        <button
          type="button"
          (click)="previous()"
          aria-label="Previous screenshot"
          class="absolute left-3 top-1/2 -translate-y-1/2
                 flex h-10 w-10 items-center justify-center
                 rounded-full bg-black/50 text-white
                 backdrop-blur-sm transition hover:bg-black/80"
        >
          <span class="text-2xl">&lsaquo;</span>
        </button>

        <!-- Next -->
        <button
          type="button"
          (click)="next()"
          aria-label="Next screenshot"
          class="absolute right-3 top-1/2 -translate-y-1/2
                 flex h-10 w-10 items-center justify-center
                 rounded-full bg-black/50 text-white
                 backdrop-blur-sm transition hover:bg-black/80"
        >
          <span class="text-2xl">&rsaquo;</span>
        </button>
      }

      <!-- Screenshot counter -->
      <div
        class="absolute bottom-3 right-3 rounded-full
               bg-black/60 px-3 py-1 text-xs text-white"
      >
        {{ currentIndex() + 1 }} / {{ images.length }}
      </div>

    </div>

    <!-- Pagination dots -->
    @if (images.length > 1) {
      <div class="flex items-center justify-center gap-2 bg-slate-950 py-4">

        @for (image of images; track $index) {
          <button
            type="button"
            (click)="goTo($index)"
            [attr.aria-label]="'Go to screenshot ' + ($index + 1)"
            [class]="currentIndex() === $index
              ? 'w-6 bg-white'
              : 'w-2 bg-slate-500 hover:bg-slate-300'"
            class="h-2 rounded-full transition-all duration-300"
          ></button>
        }

      </div>
    }
  }

</div>
