<div class="fixed top-0 z-50 w-full bg-slate-900 px-4 py-3 text-white shadow-lg">

  <nav class="mx-auto max-w-7xl">

    <!-- Main navbar -->
    <div class="relative flex h-16 items-center justify-between">

      <!-- Mobile menu button -->
      <div class="flex items-center sm:hidden">

        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center rounded-full bg-gray-100 p-2 text-gray-900 hover:bg-white focus:outline-none"
          [attr.aria-expanded]="mobileMenuOpen"
          aria-label="Toggle main menu"
        >

          @if (!mobileMenuOpen) {

            <!-- Hamburger -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              class="size-6"
            >
              <path
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          } @else {

            <!-- X -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              class="size-6"
            >
              <path
                d="M6 18 18 6M6 6l12 12"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          }

        </button>

      </div>


      <!-- Logo -->
      <div class="flex shrink-0 items-center">

            <img
              ngSrc="images/portfolio_logo.png"
              width="50"
              height="10"
              alt="Company Logo"
              routerLink="/"
              class="logo cursor-pointer"
            />

      </div>


      <!-- Desktop navigation -->
      <div class="hidden sm:block">

        <div class="flex items-center space-x-4 rounded-4xl border border-white px-10 py-3">

          <a
            routerLink="/dashboard"
            routerLinkActive="bg-white !text-gray-800"
            [routerLinkActiveOptions]="{ exact: true }"
            class="w-25 rounded-4xl bg-gray-600 px-3 py-2 text-center text-sm font-medium text-white transition hover:bg-white hover:text-gray-800"
          >
            Dashboard
          </a>

          <a
            routerLink="/profile"
            routerLinkActive="bg-white !text-gray-800"
            class="w-25 rounded-4xl bg-gray-600 px-3 py-2 text-center text-sm font-medium text-white transition hover:bg-white hover:text-gray-800"
          >
            Profile
          </a>

          <a
            routerLink="/projects"
            routerLinkActive="bg-white !text-gray-800"
            class="w-25 rounded-4xl bg-gray-600 px-3 py-2 text-center text-sm font-medium text-white transition hover:bg-white hover:text-gray-800"
          >
            Projects
          </a>

        </div>

      </div>


      <!-- Profile -->
      <div class="relative">

        <button
          type="button"
          (click)="toggleProfileMenu()"
          class="relative flex cursor-pointer rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [attr.aria-expanded]="profileMenuOpen"
        >

          <span class="sr-only">
            Open user menu
          </span>

          <img
            ngSrc="images/profile.jpg"
            width="50"
            height="50"
            alt="Profile"
            class="profile rounded-full"
          />

        </button>


        <!-- Profile dropdown -->
        @if (profileMenuOpen) {

          <div
            class="absolute right-0 top-14 z-50 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black/5"
          >

            <a
              href="#"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              Notifications
            </a>

            <a
              href="#"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
            >
              Settings
            </a>

            <button
              type="button"
              class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100"
            >
              Sign out
            </button>

          </div>

        }

      </div>

    </div>


    <!-- Mobile navigation -->
    @if (mobileMenuOpen) {

      <div class="border-t border-slate-700 py-4 sm:hidden">

        <div class="space-y-2">

          <a
            routerLink="/dashboard"
            routerLinkActive="bg-gray-600"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
            class="block rounded-md px-4 py-3 text-base font-medium text-white hover:bg-gray-700"
          >
            Dashboard
          </a>

          <a
            routerLink="/profile"
            routerLinkActive="bg-gray-600"
            (click)="closeMobileMenu()"
            class="block rounded-md px-4 py-3 text-base font-medium text-white hover:bg-gray-700"
          >
            Profile
          </a>

          <a
            routerLink="/projects"
            routerLinkActive="bg-gray-600"
            (click)="closeMobileMenu()"
            class="block rounded-md px-4 py-3 text-base font-medium text-white hover:bg-gray-700"
          >
            Projects
          </a>

        </div>

      </div>

    }

  </nav>

</div>
